<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 320" role="img" aria-labelledby="title desc">
  <title id="title">Ticklect. i make stuff.</title>
  <desc id="desc">Dark graphical header with a small terminal window, describing a developer who builds tools and experiments.</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="1" stop-color="#172A37"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#A1F5CC"/>
      <stop offset="1" stop-color="#84D7F7"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#B2D9E0" stroke-opacity=".06"/>
    </pattern>
    <clipPath id="bounds"><rect x="1" y="1" width="1078" height="318" rx="22"/></clipPath>
  </defs>

  <rect x="1" y="1" width="1078" height="318" rx="22" fill="url(#surface)" stroke="#344957" stroke-width="2"/>
  <g clip-path="url(#bounds)">
    <rect width="1080" height="320" fill="url(#grid)"/>
    <path d="M0 0H12V320H0Z" fill="url(#accent)"/>
    <circle cx="1017" cy="23" r="130" fill="#83E8DF" opacity=".035"/>
    <circle cx="615" cy="325" r="220" fill="#8DBFF7" opacity=".035"/>
  </g>

  <rect x="56" y="45" width="9" height="9" rx="2" fill="#A1F5CC"/>
  <text x="78" y="54" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="2.2" fill="#9DB8C4">TICKLECT / 001</text>

  <text x="56" y="151" font-family="'Segoe UI', Arial, sans-serif" font-weight="750" font-size="74" letter-spacing="-2.8" fill="#F4F9FA">i make stuff<tspan fill="#A1F5CC">.</tspan></text>
  <text x="59" y="194" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#BCCDD7">tools, experiments and questionable ideas</text>

  <path d="M57 232H580" stroke="#49606B" stroke-width="1"/>
  <text x="58" y="265" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing=".8" fill="#A1F5CC">MCP</text>
  <text x="109" y="265" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#5D7887">/</text>
  <text x="129" y="265" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing=".8" fill="#D6E6EA">TV APPS</text>
  <text x="220" y="265" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#5D7887">/</text>
  <text x="240" y="265" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing=".8" fill="#D6E6EA">AUTOMATION</text>
  <text x="364" y="265" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#5D7887">/</text>
  <text x="384" y="265" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing=".8" fill="#D6E6EA">GAMES</text>

  <g transform="translate(652 42)">
    <rect x="9" y="10" width="372" height="236" rx="14" fill="#060D13" opacity=".28"/>
    <rect width="372" height="236" rx="14" fill="#0A151D" stroke="#4B6971" stroke-width="1.5"/>
    <path d="M0 43H372" stroke="#344753"/>
    <circle cx="22" cy="22" r="5" fill="#E38D91"/>
    <circle cx="40" cy="22" r="5" fill="#EDCA86"/>
    <circle cx="58" cy="22" r="5" fill="#99E7BC"/>
    <text x="186" y="27" text-anchor="middle" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#7996A5">ticklect@local ~</text>

    <text x="24" y="80" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#A2F0C8">$</text>
    <text x="46" y="80" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#DEE9EC">what are you building?</text>
    <text x="24" y="113" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#8EB0BE">something i wanted to exist.</text>
    <text x="24" y="157" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#A2F0C8">$</text>
    <text x="46" y="157" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#DEE9EC">status</text>
    <text x="24" y="190" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#8EB0BE">still making stuff</text>
    <rect x="198" y="177" width="9" height="16" rx="1" fill="url(#accent)"/>
  </g>
</svg>
